<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Discord Profile</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="overlay">
  <h1>CLICK / TAP TO ACCESS</h1>
  <p>Enter the profile experience</p>
</div>

<audio id="bgMusic" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<div class="container hidden" id="mainContent">

  <div class="profile-card">
    <img src="https://cdn.discordapp.com/embed/avatars/0.png" class="avatar">

    <h1>Your Discord Name</h1>
    <p class="tag">@yourusername</p>

    <div class="badges">
      <span>Developer</span>
      <span>Editor</span>
      <span>Gamer</span>
    </div>

    <div class="bio">
      <h2>About Me</h2>
      <p>
        Add your full Discord bio here.
        You can flex your setup, socials, games,
        projects, or anything you want.
      </p>
    </div>

    <div class="socials">
      <a href="#">Discord</a>
      <a href="#">TikTok</a>
      <a href="#">YouTube</a>
    </div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
