
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>novadish</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
overflow:hidden;
background:url('background.jpg') center/cover no-repeat fixed;
display:flex;
justify-content:center;
align-items:center;
color:white;
}

.overlay{
position:fixed;
inset:0;
background:black;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:9999;
cursor:pointer;
}

.overlay h1{
font-size:4rem;
animation:pulse 1.5s infinite;
}

@keyframes pulse{
0%{transform:scale(1);}
50%{transform:scale(1.08);}
100%{transform:scale(1);}
}

.card{
width:420px;
background:rgba(0,0,0,0.65);
border-radius:25px;
overflow:hidden;
backdrop-filter:blur(14px);
border:1px solid rgba(255,255,255,0.1);
box-shadow:0 0 40px rgba(180,0,255,0.6);
}

.banner{
height:170px;
background:url('background.jpg') center/cover;
}

.content{
padding:20px;
margin-top:-70px;
}

.pfp{
width:120px;
height:120px;
border-radius:24px;
border:4px solid #111;
object-fit:cover;
}

.name{
font-size:2rem;
font-weight:bold;
margin-top:10px;
}

.user{
opacity:0.7;
margin-bottom:10px;
}

.bio{
margin-top:15px;
line-height:1.5;
}

.activity{
margin-top:20px;
background:rgba(255,255,255,0.08);
padding:15px;
border-radius:18px;
}

.activity img{
width:70px;
height:70px;
border-radius:14px;
margin-right:12px;
}

.row{
display:flex;
align-items:center;
}

.green{
color:#57F287;
}

.small{
opacity:0.7;
font-size:0.9rem;
}
</style>
</head>

<body>

<div class="overlay" id="overlay">
<h1>CLICK / TAP TO ENTER</h1>
<p>novadish</p>
</div>

<audio id="music"></audio>

<div class="card">

<div class="banner"></div>

<div class="content">

<img src="pfp.png" class="pfp">

<div class="name">Novadish</div>
<div class="user">@novadish</div>

<div class="bio">
Don't Hate the player hate the game - Novadish<br>
---<br><br>
View Full Bio
</div>

<div class="activity">

<div class="small">Playing</div>

<div class="row" style="margin-top:10px;">
<img src="pfp.png">

<div>
<div style="font-weight:bold;">Ja Morant Sim</div>
<div class="green">● 25763:10:43</div>
<div class="small">Dunking on KIds (1 of 1)</div>
</div>

</div>

</div>

</div>

</div>

<script>
const overlay = document.getElementById('overlay');
const music = document.getElementById('music');

const songs = ['music.mp3','loveme.mp3'];
let current = 0;

function playSong(index){
 music.src = songs[index];
 music.volume = 0.5;
 music.play();
}

music.addEventListener('ended', ()=>{
 current = (current + 1) % songs.length;
 playSong(current);
});

overlay.onclick = ()=>{
 overlay.style.display = 'none';
 playSong(current);
}
</script>

</body>
</html>
