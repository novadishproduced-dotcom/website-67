
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>novadish</title>

<style>
body{
  margin:0;
  overflow:hidden;
  background:url('https://wallpapercave.com/wp/wp12675664.jpg') center/cover no-repeat fixed;
  font-family:Arial,sans-serif;
  color:white;
}

.overlay{
  position:fixed;
  inset:0;
  background:black;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  z-index:9999;
  cursor:pointer;
}

.overlay h1{
  font-size:4rem;
  animation:pulse 1.5s infinite;
}

@keyframes pulse{
  0%{transform:scale(1);}
  50%{transform:scale(1.08);}
  100%{transform:scale(1);}
}

.main{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.card{
  width:420px;
  background:rgba(0,0,0,0.6);
  border-radius:25px;
  overflow:hidden;
  backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,0.1);
  box-shadow:0 0 40px rgba(128,0,255,0.5);
}

.banner{
  height:160px;
  background:url('https://wallpapercave.com/wp/wp12675664.jpg') center/cover;
}

.content{
  text-align:center;
  padding:20px;
  margin-top:-70px;
}

.pfp{
  width:120px;
  height:120px;
  border-radius:50%;
  border:5px solid #111;
}

.username{
  opacity:0.7;
}

.badges span{
  display:inline-block;
  background:#5865F2;
  padding:6px 12px;
  margin:5px;
  border-radius:999px;
}

.status{
  margin-top:20px;
  padding:12px;
  background:rgba(255,255,255,0.06);
  border-radius:15px;
}
</style>
</head>

<body>

<div class="overlay" id="overlay">
<h1>CLICK TO ENTER</h1>
<p>novadish</p>
</div>

<audio id="music"></audio>

<div class="main">
<div class="card">

<div class="banner"></div>

<div class="content">
<img class="pfp" src="https://cdn.discordapp.com/embed/avatars/0.png">

<h1>novadish</h1>
<div class="username">@novadish</div>

<div class="badges">
<span>Developer</span>
<span>Nova</span>
<span>Hoovers</span>
</div>

<div class="status">
🟢 Online<br>
🎵 Love Me / THE HOOVAS
</div>

</div>
</div>
</div>

<script>
const overlay = document.getElementById('overlay');
const music = document.getElementById('music');

const songs = ['music.mp3','loveme.mp3'];
let current = 0;

function playSong(i){
 music.src = songs[i];
 music.play();
}

music.addEventListener('ended',()=>{
 current = (current + 1) % songs.length;
 playSong(current);
});

overlay.onclick = ()=>{
 overlay.style.display='none';
 playSong(current);
}
</script>

</body>
</html>
