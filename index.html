
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>novadish</title>

<style>
body{
margin:0;
height:100vh;
overflow:hidden;
font-family:Arial;
background:url('profile_reference.png') center/cover no-repeat fixed;
display:flex;
justify-content:center;
align-items:center;
color:white;
}

.overlay{
position:fixed;
inset:0;
background:black;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:999;
cursor:pointer;
}

.card{
width:420px;
background:rgba(0,0,0,0.6);
border-radius:25px;
backdrop-filter:blur(12px);
overflow:hidden;
box-shadow:0 0 40px rgba(140,0,255,0.6);
border:1px solid rgba(255,255,255,0.1);
}

.banner{
height:150px;
background:rgba(255,255,255,0.05);
}

.content{
padding:20px;
text-align:center;
margin-top:-70px;
}

.pfp{
width:120px;
height:120px;
border-radius:50%;
border:5px solid #111;
object-fit:cover;
}

.badge{
display:inline-block;
background:#5865F2;
padding:6px 12px;
border-radius:999px;
margin:4px;
}

.status{
margin-top:20px;
padding:12px;
border-radius:15px;
background:rgba(255,255,255,0.06);
}
</style>
</head>

<body>

<div class="overlay" id="overlay">
<h1>CLICK TO ENTER</h1>
<p>novadish</p>
</div>

<audio id="music"></audio>

<div class="card">
<div class="banner"></div>

<div class="content">

<img src="pfp.png" class="pfp">

<h1>novadish</h1>
<p>@novadish</p>

<div>
<span class="badge">Nova</span>
<span class="badge">Developer</span>
<span class="badge">Hoovers</span>
</div>

<div class="status">
🟢 Online<br>
🎵 Love Me / THE HOOVAS
</div>

</div>
</div>

<script>
const overlay = document.getElementById('overlay');
const music = document.getElementById('music');

const songs = ['music.mp3','loveme.mp3'];
let current = 0;

function playSong(i){
 music.src = songs[i];
 music.play();
}

music.addEventListener('ended',()=>{
 current = (current + 1) % songs.length;
 playSong(current);
});

overlay.onclick = ()=>{
 overlay.style.display='none';
 playSong(current);
}
</script>

</body>
</html>
